# Netlify configuration for the Diwali kiosk site.
# This is a fully static site (no build step needed).

[build]
  # Nothing to build for the static site — just publish the project root.
  # Netlify will still install package.json deps and bundle the functions below.
  publish = "."
  command = ""
  functions = "netlify/functions"

  [build.environment]
    # Secrets scanning false-positive handling.
    #
    # Verified: NO R2 secret is committed to the repo or git history — there is
    # no .env tracked and no hardcoded key/secret in any file. The credentials
    # live ONLY as Netlify environment variables and are read via process.env
    # in netlify/functions/_r2.js.
    #
    # Netlify's scanner matches the VALUES of these env vars in the bundled
    # function build output (esbuild) and flags them. Since nothing sensitive
    # is in the repo, we exclude the four R2 keys from scanning. R2_ACCOUNT_ID
    # and R2_BUCKET are non-secret identifiers; R2_ACCESS_KEY_ID and
    # R2_SECRET_ACCESS_KEY are secret but are not present in the repository.
    SECRETS_SCAN_OMIT_KEYS = "R2_ACCOUNT_ID,R2_BUCKET,R2_ACCESS_KEY_ID,R2_SECRET_ACCESS_KEY"

[functions]
  # Bundle the AWS SDK with each Art Studio function.
  node_bundler = "esbuild"

# --- Art Studio API (Cloudflare R2 uploads + gallery) ---
[[redirects]]
  from = "/api/upload-art"
  to = "/.netlify/functions/upload-art"
  status = 200

[[redirects]]
  from = "/api/list-art"
  to = "/.netlify/functions/list-art"
  status = 200

[[redirects]]
  from = "/api/get-art"
  to = "/.netlify/functions/get-art"
  status = 200

# Sensible security + caching headers for a static kiosk site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"
